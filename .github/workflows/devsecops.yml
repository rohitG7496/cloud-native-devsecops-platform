name: Tradein DevSecOps pipeline
on: [push, workflow_dispatch]
jobs:
  Build-job:
    runs-on: ubuntu-latest
    steps: 
      - name: 1. checkout tradein repo
        uses: actions/checkout@v6
        with: 
          repository: rohitG7496/tradeIn
          ref: main

      - name: 2. setup node js 
        uses: actions/setup-node@v4
        with: 
          node-version: 16

      - name: 3. install dependencies and build
        run: |
          cd Frontend
          npm install --legacy-peer-deps
          npm run build
        env:
          CI: false
          
      - name: Upload Build Folder
        uses: actions/upload-artifact@v4
        with:
          name: production-files 
          path: Frontend/build/
          retention-days: 1

  security-SCA-scan:
    runs-on: ubuntu-latest
    needs: Build-job
    steps: 
      - name: 1. Download Build Folder
        uses: actions/download-artifact@v4
        with:
          name: production-files 
          path: app-to-scan      

      - name: Run Snyk Scan
        run: |
          # The files are now in 'app-to-scan/'
          ls -R app-to-scan/
          npx snyk test --file=app-to-scan/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}