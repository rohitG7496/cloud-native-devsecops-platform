name: Tradein DevSecOps pipeline
on:
  repository_dispatch:
    types: [tradein-pr-merged]
  workflow_dispatch:

# required to fetch the OIDC JWT token
permissions:
  id-token: write # Required to request the OIDC JWT from GitHub
  contents: read # Required to check out repository code

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::564186749794:role/GitHubActions-TradeIn-Role
  ECR_REPOSITORY: tradein

jobs:
  Build-and-Scan:
    runs-on: ubuntu-latest
    steps:
      - name: 1. checkout tradein repo
        uses: actions/checkout@v6
        with:
          repository: rohitG7496/tradeIn
          ref: main

      - name: 2. setup node js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: 3. install dependencies
        run: |
          cd Frontend
          npm install --legacy-peer-deps
        env:
          CI: true

      - name: 4. Run Snyk Security Package Vulnerabilities Scan
        run: |
          cd Frontend
          npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: 5. Build Application
        run: |
          cd Frontend
          npm run build
        env:
          CI: false
        continue-on-error: true

      - name: 6. Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}

      - name: 7. Login to ECR repo
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 8. Build and Push Frontend Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building frontend image"
          cd Frontend
          docker build -t $REGISTRY/$ECR_REPOSITORY:frontend-latest .

          echo "Pushing to ECR"
          docker push $REGISTRY/$ECR_REPOSITORY:frontend-latest

      - name: 9. Build and Push Backend Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building backend image"
          cd Backend
          docker build -t $REGISTRY/$ECR_REPOSITORY:backend-latest .

          echo "Pushing to ECR"
          docker push $REGISTRY/$ECR_REPOSITORY:backend-latest
