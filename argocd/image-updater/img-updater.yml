---
# ArgoCD Image Updater - ConfigMap
# Controls polling interval, log level, and ECR registry config
# Credentials sourced from aws-ecr-creds secret (managed by ESO)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  # How often Image Updater polls ECR for new image tags
  interval: 2m

  # Log level: use "debug" first to verify ECR connectivity, then switch to "info"
  log.level: info

  # ECR private registry configuration
  registries.conf: |
    registries:
    - name: ECR
      api_url: https://564186749794.dkr.ecr.ap-south-1.amazonaws.com
      prefix: 564186749794.dkr.ecr.ap-south-1.amazonaws.com
      ping: false
      insecure: false
      credsexpire: 10h
