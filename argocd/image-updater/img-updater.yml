---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  # How often Image Updater polls ECR for new image tags
  interval: 2m
  # Log level: use "debug" initially to verify ECR connectivity, then switch to "info"
  log.level: info
  # ECR registry configuration
  registries.conf: |
    registries:
    - name: ECR
      api_url: https://564186749794.dkr.ecr.ap-south-1.amazonaws.com
      prefix: 564186749794.dkr.ecr.ap-south-1.amazonaws.com
      ping: false
      insecure: false
      credsexpire: 10h

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: argocd-image-updater
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-ecr-creds   
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-ecr-creds
                  key: aws_secret_access_key
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-ecr-creds
                  key: aws_region
