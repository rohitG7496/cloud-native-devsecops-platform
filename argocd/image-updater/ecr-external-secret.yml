---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-secrets
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tradein-aws-store   
    kind: ClusterSecretStore
  target:
    name: argocd-image-updater-ssh-key  
    creationPolicy: Owner
  data:
    - secretKey: sshPrivateKey    
      remoteRef:
        key: trade/in/prod
        property: sshPrivateKey
