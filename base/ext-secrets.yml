---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: tradein-aws-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-tradein
  namespace: tradein
spec:
  refreshInterval: "1h"
  SecretStoreRef:
    name: tradein-aws-store
    kind: ClusterSecretStore
  target:
    name: tradein-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: trade/in/prod
